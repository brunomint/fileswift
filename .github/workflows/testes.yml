name: Testes

on:
  push:
  pull_request:
  # Permite que outros workflows (ex: build-windows) usem este job como gate.
  workflow_call: {}

jobs:
  pytest:
    # Windows entra porque resolver_caminho_seguro compara caminhos com os.sep e
    # realpath, e lá o separador é "\", o filesystem é case-insensitive e existe
    # letra de unidade. Código de segurança validado só no Linux não cobre isso.
    # O _data_dir_padrao() também tem um ramo só de Windows (LOCALAPPDATA).
    #
    # Python 3.8 é o piso que o install.sh aceita, e é onde o pytest está fixado
    # em 8.3.5. Fica no ubuntu-22.04 porque o 24.04 não oferece 3.8 pelo
    # setup-python. macOS fica de fora: o README diz que não é suportado.
    strategy:
      # Sem fail-fast: uma plataforma quebrando não deve esconder o resultado
      # das outras.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
          - os: ubuntu-22.04
            python: "3.8"

    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements.dev.txt

      - name: Rodar testes
        run: pytest -q
